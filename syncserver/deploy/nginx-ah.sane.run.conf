limit_req_zone $http_cf_connecting_ip zone=wow_ah_upload:10m rate=6r/m;
limit_req_zone $http_cf_connecting_ip zone=wow_ah_read:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ah.sane.run;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ah.sane.run;
    server_tokens off;
    autoindex off;

    ssl_certificate /etc/ssl/certs/ah-sane-run-origin.pem;
    ssl_certificate_key /etc/ssl/private/ah-sane-run-origin.key;
    ssl_client_certificate /etc/nginx/certs/ah-aop-ca.pem;
    ssl_verify_client optional;
    if ($ssl_client_verify != SUCCESS) { return 400; }
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/v1/markets/[a-z]+/[a-z0-9-]+/(horde|alliance)/uploads$ {
        if ($request_method != POST) { return 405; }
        limit_req zone=wow_ah_upload burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /v1/markets/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_req zone=wow_ah_read burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
