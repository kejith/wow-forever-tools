name: Build

# Tests and the Windows installer. Called by CI for every push and by the release workflow for a tag, so a
# release is built exactly the way CI built it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7 # only for the page's catalog test (app/renderer.test.js), no npm packages
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.3.3 # only for the MCP server (server/), which stays in Python
        with:
          enable-cache: false # the server carries its dependencies in the header, there is no lock file to key a cache on
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: app/go.sum # sim/ has no dependencies; the app has Wails
      - name: Page tests (translations, window.wow)
        run: node app/renderer.test.js
      - name: App tests (addon install, releases, update, translations)
        # Without the Wails build tags the app compiles on any system; the tests need no window.
        working-directory: app
        run: |
          go vet ./...
          go test ./...
      - name: Game tables for the Go tests
        # The bridge's golden test and the tool packages read the DB2 tables of the test folder's client build;
        # the first run downloads them from wago.tools (about 100 MB), later runs take them from the cache.
        uses: actions/cache@v6
        with:
          path: scripts/cache/*.csv
          # A new code version may read another table: it restores the last cache, downloads what is missing
          # and saves the whole set under its own key.
          key: db2-${{ hashFiles('scripts/fixtures/forever/WTF/Account/*/93/*/SavedVariables/WoWToolsForever.lua') }}-${{ hashFiles('sim/**/*.go') }}
          restore-keys: db2-${{ hashFiles('scripts/fixtures/forever/WTF/Account/*/93/*/SavedVariables/WoWToolsForever.lua') }}-
      - name: Go tests (sim/)
        # Includes the bridge's golden test: every command on the test folder against the answers the Python
        # bridge gave before it was removed (notes/go-migration.md).
        working-directory: sim
        run: |
          go vet ./...
          go test ./...
      - name: MCP server tests
        shell: bash
        run: |
          for test in server/test_*.py; do
            echo "::group::$test"
            uv run "$test"
            echo "::endgroup::"
          done

  package:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: app/go.sum
      - name: NSIS
        run: |
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
      - name: Build the app and the installer
        run: bash app/build.sh --installer
      - name: Install it and start it once
        # Installs silently into a temporary folder, renders every page of the installed app against the test
        # data and fails when a required page does not work. The screenshots are uploaded below.
        shell: pwsh
        env:
          WOW_FOREVER_DIR: ${{ github.workspace }}\scripts\fixtures\goldperhour
        run: |
          $version = (Get-Content app/VERSION -Raw).Trim()
          $dir = Join-Path $env:RUNNER_TEMP 'wow-tools-forever'
          $setup = Start-Process -FilePath "app/build/bin/WoW-Tools-Forever-Setup-$version.exe" -ArgumentList '/S', '--updated', "/D=$dir" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "the installer failed with exit code $($setup.ExitCode)" }
          $exe = Join-Path $dir 'WoW Tools Forever.exe'
          if (-not (Test-Path (Join-Path $dir 'scripts/data/item_names.json'))) { throw 'the installer left out scripts/data' }
          $app = Start-Process -FilePath $exe -ArgumentList '--capture=smoke', '--lang=en', '--require=connection,goldperhour' -WorkingDirectory app -PassThru -Wait
          Get-Content app/smoke/report.json -ErrorAction SilentlyContinue
          if ($app.ExitCode -ne 0) { throw "the installed app failed its smoke test (exit code $($app.ExitCode))" }
          $report = Get-Content app/smoke/report.json -Raw | ConvertFrom-Json
          if (-not $report.packaged) { throw 'not the installed app' }
          if ($report.bridge -ne $exe) { throw "the bridge was not the installed app: $($report.bridge)" }
          $uninstall = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "the uninstaller failed with exit code $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: app/build/bin/WoW-Tools-Forever-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: app/smoke
          if-no-files-found: ignore
