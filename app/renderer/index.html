<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: wowicon:">
  <title>WoW Forever Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div>
        <div class="brand-name">Forever Tools</div>
        <div class="brand-sub">WoW: Forever <span id="app-version"></span></div>
      </div>
    </div>
    <nav id="nav">
      <button data-page="connection"><span class="dot" id="nav-dot"></span><span data-i18n="Connection">Connection</span></button>
      <button data-page="character" data-i18n="Character">Character</button>
      <button data-page="writs" data-i18n="Writs">Writs</button>
      <button data-page="upgrades" data-i18n="AH upgrades">AH upgrades</button>
      <button data-page="rotations" data-i18n="Rotations">Rotations</button>
      <button data-page="recipes" data-i18n="Professions">Professions</button>
      <button data-page="consumables" data-i18n="Consumables">Consumables</button>
      <button data-page="pricehistory" data-i18n="Price history">Price history</button>
      <button data-page="goldperhour" data-i18n="Gold per hour">Gold per hour</button>
    </nav>
    <div class="sidebar-foot">
      <button type="button" id="update-pill" class="update-pill" hidden></button>
      <label class="lang-select"><span><span data-i18n="Language">Language</span>
          <button type="button" class="help" data-i18n-help="Automatic follows the language of the game client">?</button></span>
        <select id="lang-select">
          <option value="auto" data-i18n="Automatic">Automatic</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
      <div id="live-state" data-i18n="Waiting for data …">Waiting for data …</div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="page-title"></h1>
      <div class="topbar-right">
        <label class="char-select"><span data-i18n="Character">Character</span>
          <select id="char-select"></select>
        </label>
        <button id="refresh" class="ghost" data-i18n="↻ Refresh" data-i18n-title="Reload">↻ Refresh</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
  <div id="wtip"></div>
  <div id="pop" role="tooltip"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
